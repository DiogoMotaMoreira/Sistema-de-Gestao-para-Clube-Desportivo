spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    root: INFO
    com.sigd: INFO
  file:
    name: /var/log/sigd/app.log
    max-size: 10MB
    max-history: 30

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

sigd:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000
    refresh-expiration: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sigd.boavista.pt}
